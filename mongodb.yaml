- name: configuring mongodb server
  hosts: frontend
  become: yes
  tasks:
   - name: copy the var_files
     ansible.builtin.copy:
        src: mongo.repo
        dest: /etc/yum.repos.d/mongo.repo
      
   - name: installing mongodb-org
     ansible.builtin.dnf:
       name: mongodb-org
       state: present

   - name: start and enable the service
     ansible.builtin.service:
       name: mongod
       state: started
       enabled: yes

   - name: replace the address
     ansible.builtin.replace:
       path: /etc/mongod.conf
       regexp: '127.0.0.1'
       replace: '0.0.0.0'

   -  name: restart the service
      ansible.builtin.service: 
        name: mongod
        state: restarted


      